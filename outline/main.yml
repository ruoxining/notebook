site_name: Mini-Babel Library
site_url: https://ruoxining.github.io/notebook
repo_url: https://github.com/ruoxining/notebook
repo_name: notebook

nav:
  - Index: 'index.md'

theme:
  name: material
  palette:
    primary: white
    accent: indigo
    toggle:
      icon: material/toggle-switch
      name: Switch to dark mode
    scheme: preference
  language: en
  features:
    - content.code.copy
    # - navigation.expand # navigation fully expanded
    # - navigation.top  # horizontal navigation
    # - navigation.tabs # vertical navigation
  font:
    text: LXGW WenKai
    code: JetBrains Mono

extra_css:
    - stylesheets/extra.css
    - https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css

plugins:
  - search
  - statistics
  # - mkdocs-video:
  #     is_video: True
  #     video_muted: True
  #     video_controls: True
  #     css_style:
  #       width: "50%"
  - changelog:
      file: changelog.yml

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - javascripts/tex-mml-chtml.js
